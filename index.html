<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Anti-AI Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%); }
        .gradient-btn { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); transition: all 0.3s ease; }
        .gradient-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body class="bg-[#0f0c1b] text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Header -->
    <header class="w-full max-w-2xl text-center my-6">
        <div class="inline-block p-3 rounded-2xl bg-purple-900/30 border border-purple-700/40 mb-3">
            <svg class="w-8 h-8 text-purple-400 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
            </svg>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-white">TikTok Anti-AI Re-up Engine</h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">Hệ thống tự động tải & render chuyên sâu lách thuật toán AI - Giữ nguyên nét căng 1080p/4K</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-2xl bg-[#161224] border border-purple-900/40 rounded-3xl p-6 shadow-2xl backdrop-blur-xl">
        
        <!-- Input Form -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-purple-300 uppercase tracking-wider mb-2">Dán Link Video TikTok Gốc</label>
                <div class="relative">
                    <input type="text" id="videoUrl" placeholder="https://www.tiktok.com/@username/video/..." 
                        class="w-full bg-[#1e1836] border border-purple-800/60 rounded-xl px-4 py-3.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition">
                </div>
            </div>

            <button onclick="submitTask()" id="submitBtn" class="w-full gradient-btn py-3.5 rounded-xl font-bold text-sm text-white shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2">
                <span>🚀 Đưa Vào Hàng Đợi Render</span>
            </button>
        </div>

        <!-- Status Notification -->
        <div id="statusBox" class="hidden mt-4 p-3 rounded-xl text-xs font-medium text-center transition"></div>

        <!-- History / Results Section -->
        <div class="mt-8 border-t border-purple-900/40 pt-6">
            <h3 class="text-xs font-bold uppercase tracking-wider text-purple-400 mb-4 flex items-center justify-between">
                <span>Danh Sách Đã Render & Quản Lý Drive</span>
                <span id="itemCount" class="bg-purple-900/60 px-2 py-0.5 rounded-full text-[10px] text-purple-300">0 video</span>
            </h3>

            <div id="historyGrid" class="space-y-3 max-h-[350px] overflow-y-auto pr-1">
                <!-- Danh sách item render sẽ được load tự động vào đây -->
                <div class="text-center py-6 text-slate-500 text-xs">Chưa có video nào được render gần đây.</div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl text-center mt-8 text-xs text-slate-500">
        <p>Google Drive & Google Colab Pipeline Automation © 2026</p>
    </footer>

    <!-- JavaScript Xử Lý -->
    <script>
        // THAY LINK GOOGLE APPS SCRIPT CỦA ANH VÀO ĐÂY
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzdl3DrKxLlyHHBU1T9-sfOOyQEuL-4J9FFPCFvxIP2LJqE8u4UB46tAl7Z01e2f03tmg/exec";

        async function submitTask() {
            const urlInput = document.getElementById('videoUrl');
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const url = urlInput.value.trim();

            if (!url.includes('tiktok.com')) {
                showStatus('Vui lòng nhập một link TikTok hợp lệ!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Đang gửi link vào hệ thống...</span>';

            try {
                // Gửi link qua Google Apps Script để ghi vào queue.json trên Drive
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                showStatus('✅ Đã đẩy task thành công! Google Colab đang tiến hành render...', 'success');
                urlInput.value = '';
                setTimeout(loadHistory, 3000); // Tải lại lịch sử sau 3 giây
            } catch (error) {
                showStatus('❌ Lỗi kết nối hệ thống. Vui lòng thử lại!', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>🚀 Đưa Vào Hàng Đợi Render</span>';
            }
        }

        function showStatus(message, type) {
            const box = document.getElementById('statusBox');
            box.className = `mt-4 p-3 rounded-xl text-xs font-medium text-center ${type === 'success' ? 'bg-emerald-950/60 text-emerald-300 border border-emerald-800/50' : 'bg-rose-950/60 text-rose-300 border border-rose-800/50'}`;
            box.innerText = message;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 5000);
        }

        async function loadHistory() {
            try {
                // Đọc file result.json từ Google Apps Script (GET method)
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                
                const historyGrid = document.getElementById('historyGrid');
                const itemCount = document.getElementById('itemCount');
                
                if (!data || data.length === 0) {
                    historyGrid.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Chưa có video nào hoàn thành.</div>`;
                    itemCount.innerText = `0 video`;
                    return;
                }

                itemCount.innerText = `${data.length} video`;
                historyGrid.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-[#1d1734] border border-purple-900/30 rounded-xl p-3 flex justify-between items-center gap-3 hover:border-purple-700/50 transition";
                    card.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-semibold text-purple-200 truncate" title="${item.title}">${item.title}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">🕒 ${item.date || 'Vừa xong'}</p>
                        </div>
                        <div class="flex gap-2 shrink-0">
                            <!-- Nút Mở Thư Mục Trên Google Drive -->
                            <a href="${item.folderUrl || '#'}" target="_blank" class="bg-purple-900/60 hover:bg-purple-800 px-3 py-2 rounded-lg text-xs font-bold text-purple-200 border border-purple-700/50 transition flex items-center gap-1.5" title="Mở thư mục chứa video trên Drive">
                                <span>📂 Mở Folder</span>
                            </a>
                            <!-- Nút Tải Video Trực Tiếp -->
                            <a href="${item.downloadUrl || '#'}" target="_blank" class="gradient-btn px-3.5 py-2 rounded-lg text-xs font-bold text-white shadow-md flex items-center gap-1.5">
                                <span>📥 Tải MP4</span>
                            </a>
                        </div>
                    `;
                    historyGrid.appendChild(card);
                });
            } catch (err) {
                console.log("Đang chờ dữ liệu lịch sử...");
            }
        }

        // Tự động load lịch sử khi mở web và cập nhật định kỳ mỗi 10 giây
        loadHistory();
        setInterval(loadHistory, 10000);
    </script>
</body>
</html>
