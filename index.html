<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tải Video TikTok Không Logo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-2xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold mb-2">⚡ Tải Video TikTok Không Logo</h1>
            <p class="text-slate-400">Dán link TikTok vào bên dưới để bóc tách và tải xuống ngay lập tức</p>
        </header>

        <!-- Khung nhập link -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl mb-8">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="tiktokUrl" placeholder="Dán link TikTok (vd: https://vt.tiktok.com/...)" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-lg flex-1 focus:outline-none focus:border-indigo-500 text-sm">
                <button onclick="processDownload()" id="downloadBtn" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-medium text-sm transition flex items-center justify-center">Tải Ngay</button>
            </div>
            <p id="statusText" class="text-xs text-slate-400 mt-3 text-center"></p>
        </div>

        <!-- Khu vực hiển thị kết quả tải -->
        <div id="resultContainer" class="hidden bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-indigo-300">🎉 Kết quả bóc tách video:</h2>
            <div id="videoInfo" class="space-y-4">
                <!-- Nội dung video sau khi xử lý sẽ hiện ở đây -->
            </div>
        </div>
    </div>

    <script>
        async function processDownload() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const statusText = document.getElementById('statusText');
            const resultContainer = document.getElementById('resultContainer');
            const videoInfo = document.getElementById('videoInfo');
            const btn = document.getElementById('downloadBtn');

            if (!urlInput) {
                statusText.innerText = "Vui lòng dán link TikTok hợp lệ!";
                statusText.className = "text-xs text-red-400 mt-3 text-center";
                return;
            }

            btn.innerText = "Đang xử lý...";
            btn.disabled = true;
            statusText.innerText = "Đang kết nối với hệ thống bóc tách video...";
            statusText.className = "text-xs text-yellow-400 mt-3 text-center";
            resultContainer.classList.add('hidden');

            try {
                // Gọi API công khai chuyên xử lý bóc tách link TikTok
                const apiUrl = `https://tikwm.com/api/?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    const videoData = data.data;
                    
                    statusText.innerText = "Bóc tách thành công!";
                    statusText.className = "text-xs text-emerald-400 mt-3 text-center";

                    // Hiển thị thông tin và nút tải không logo
                    videoInfo.innerHTML = `
                        <div class="flex gap-4 items-start">
                            <img src="${videoData.cover}" alt="Thumbnail" class="w-24 h-32 object-cover rounded-lg border border-slate-700">
                            <div class="flex-1">
                                <h3 class="font-medium text-sm text-slate-200 line-clamp-2 mb-2">${videoData.title || "Video TikTok"}</h3>
                                <p class="text-xs text-slate-400 mb-4">Tác giả: @${videoData.author.unique_id}</p>
                                <div class="flex flex-wrap gap-2">
                                    <a href="${videoData.play}" target="_blank" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-xs font-medium transition text-center">📥 Tải Video (Không Logo)</a>
                                    <a href="${videoData.music}" target="_blank" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-xs font-medium transition text-center">🎵 Tải Nhạc Nền (MP3)</a>
                                </div>
                            </div>
                        </div>
                    `;
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error("Không thể lấy dữ liệu từ link này.");
                }
            } catch (error) {
                statusText.innerText = "Lỗi: Không thể tải video. Hãy kiểm tra lại link hoặc thử lại sau!";
                statusText.className = "text-xs text-red-400 mt-3 text-center";
            } finally {
                btn.innerText = "Tải Ngay";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
