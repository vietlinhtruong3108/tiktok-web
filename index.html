<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tự Động Hóa Video TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">🚀 Hệ Thống Tự Động Hóa Re-up TikTok</h1>
            <p class="text-slate-400 text-sm">Dán link lên web 👉 Colab tự quét & xử lý 👉 Lấy video sạch về điện thoại</p>
        </header>

        <!-- Khung nhập link đưa vào hàng đợi -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-6 shadow-xl mb-8">
            <h2 class="text-sm font-semibold mb-3 text-indigo-300">📥 Thêm Link Vào Hàng Đợi Xử Lý:</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="tiktokUrl" placeholder="Dán link TikTok (vd: https://vt.tiktok.com/...)" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-lg flex-1 focus:outline-none focus:border-indigo-500 text-sm">
                <button onclick="addToQueue()" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-medium text-sm transition text-center text-white">Gửi Vào Hàng Đợi</button>
            </div>
            <p id="statusText" class="text-xs text-slate-400 mt-3 text-center"></p>
        </div>

        <!-- Kho Video Sạch Đã Xử Lý (Hiển thị kết quả từ Colab trả về) -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">📦 Kho Video Sạch (<span id="storageCount">0</span>)</h2>
            <button onclick="clearStorage()" class="text-xs text-rose-400 hover:underline">Xóa tất cả kho</button>
        </div>
        
        <div id="storageGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Danh sách video sạch sẽ hiện ở đây -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadStorage);

        function addToQueue() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const statusText = document.getElementById('statusText');

            if (!urlInput) {
                statusText.innerText = "Vui lòng dán link TikTok hợp lệ!";
                statusText.className = "text-xs text-rose-400 mt-3 text-center";
                return;
            }

            let queue = JSON.parse(localStorage.getItem('tiktok_queue') || '[]');
            if (!queue.includes(urlInput)) {
                queue.push(urlInput);
                localStorage.setItem('tiktok_queue', JSON.stringify(queue));
                statusText.innerText = "✅ Đã đưa link vào hàng đợi thành công! Colab sẽ tự động quét.";
                statusText.className = "text-xs text-emerald-400 mt-3 text-center";
                document.getElementById('tiktokUrl').value = '';
            } else {
                statusText.innerText = "⚠️ Link này đã có trong hàng đợi rồi!";
                statusText.className = "text-xs text-amber-400 mt-3 text-center";
            }
        }

        function loadStorage() {
            const storageGrid = document.getElementById('storageGrid');
            const storageCount = document.getElementById('storageCount');
            let storage = JSON.parse(localStorage.getItem('tiktok_clean_storage') || '[]');
            
            storageCount.innerText = storage.length;
            storageGrid.innerHTML = '';

            if (storage.length === 0) {
                storageGrid.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-6">Kho video sạch đang trống. Hãy gửi link từ web và bật Colab để xử lý.</p>';
                return;
            }

            storage.forEach((item, index) => {
                storageGrid.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex gap-4 items-center justify-between">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-medium text-emerald-300 truncate mb-1">🎬 ${item.title || "Video Đã Đột Biến"}</h4>
                            <p class="text-[11px] text-slate-400 mb-2">🕒 ${item.date}</p>
                            <div class="flex gap-2">
                                <a href="${item.videoUrl}" target="_blank" download class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded text-[11px] font-medium transition text-center text-white">📥 Tải Về Máy / Điện Thoại</a>
                                <button onclick="deleteItem(${index})" class="bg-rose-900/50 hover:bg-rose-900 text-rose-300 px-3 py-1.5 rounded text-[11px] transition">Xóa</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function deleteItem(index) {
            let storage = JSON.parse(localStorage.getItem('tiktok_clean_storage') || '[]');
            storage.splice(index, 1);
            localStorage.setItem('tiktok_clean_storage', JSON.stringify(storage));
            loadStorage();
        }

        function clearStorage() {
            if(confirm("Bạn có chắc chắn muốn xóa toàn bộ kho video sạch không?")) {
                localStorage.removeItem('tiktok_clean_storage');
                loadStorage();
            }
        }
    </script>
</body>
</html>
