<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tự Động Hóa Re-up TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">🚀 Hệ Thống Tự Động Hóa Re-up TikTok</h1>
            <p class="text-slate-400 text-sm">Bấm gửi trên Web 👉 Link bay thẳng vào Google Drive 👉 Colab tự xử lý</p>
        </header>

        <!-- Khung nhập link -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-6 shadow-xl mb-8">
            <h2 class="text-sm font-semibold mb-3 text-indigo-300">📥 Dán Link TikTok Cần Xử Lý:</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="tiktokUrl" placeholder="Dán link TikTok (vd: https://vt.tiktok.com/...)" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-lg flex-1 focus:outline-none focus:border-indigo-500 text-sm">
                <button onclick="sendToDrive()" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-medium text-sm transition text-center text-white">Gửi Thẳng Vào Drive</button>
            </div>
            <p id="statusText" class="text-xs text-slate-400 mt-3 text-center"></p>
        </div>

        <!-- Kho Video Sạch Đã Xử Lý -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">📦 Kho Video Sạch Đã Hoàn Thành</h2>
            <button onclick="loadStorage()" class="text-xs text-emerald-400 hover:underline">Làm mới kho</button>
        </div>
        
        <div id="storageGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Hiển thị kết quả từ Google Drive -->
        </div>
    </div>

    <script>
        // 🔗 DÁN LINK APPS SCRIPT (WEB APP URL) CỦA ANH VÀO ĐÂY:
        const GAS_URL = "https://script.google.com/macros/s/AKfycby8SovUIyD_-j2Gs1QgHKesgslph3RbDiKOmUPCzRCsCoIu1sVKJexQfMQuJNpddLk3UA/exec"; 

        document.addEventListener("DOMContentLoaded", () => {
            loadStorage();
        });

        async function sendToDrive() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const statusText = document.getElementById('statusText');
            const submitBtn = document.getElementById('submitBtn');

            if (!urlInput) {
                statusText.innerText = "Vui lòng dán link TikTok hợp lệ!";
                statusText.className = "text-xs text-rose-400 mt-3 text-center";
                return;
            }

            submitBtn.innerText = "Đang gửi...";
            submitBtn.disabled = true;
            statusText.innerText = "⏳ Đang truyền link thẳng vào Google Drive...";
            statusText.className = "text-xs text-amber-400 mt-3 text-center";

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors", // Tránh lỗi CORS từ Google Script
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput })
                });

                statusText.innerText = "✅ Đã gửi link thẳng vào Google Drive thành công! Colab có thể xử lý ngay lập tức.";
                statusText.className = "text-xs text-emerald-400 mt-3 text-center";
                document.getElementById('tiktokUrl').value = '';
            } catch (error) {
                statusText.innerText = "❌ Lỗi kết nối: " + error;
                statusText.className = "text-xs text-rose-400 mt-3 text-center";
            } finally {
                submitBtn.innerText = "Gửi Thẳng Vào Drive";
                submitBtn.disabled = false;
            }
        }

        function loadStorage() {
            const storageGrid = document.getElementById('storageGrid');
            let storage = JSON.parse(localStorage.getItem('tiktok_clean_storage') || '[]');
            
            storageGrid.innerHTML = '';
            if (storage.length === 0) {
                storageGrid.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-6">Kho video sạch đang trống. Hãy gửi link từ web và chạy Colab nhé!</p>';
                return;
            }

            storage.forEach((item) => {
                storageGrid.innerHTML += `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex gap-4 items-center justify-between">
                        <div class="flex-1 min-w-0">
                            <h4 class="text-xs font-medium text-emerald-300 truncate mb-1">🎬 ${item.title}</h4>
                            <p class="text-[11px] text-slate-400 mb-2">📁 Đã lưu tại thư mục Google Drive: TikTok_Automation</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
