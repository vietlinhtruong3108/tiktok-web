<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapTik - Tải Video TikTok Không Logo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-btn { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); }
        .gradient-btn:hover { background: linear-gradient(135deg, #9333ea 0%, #db2777 100%); }
    </style>
</head>
<body class="bg-[#0f0b1e] text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 md:p-8 font-sans">

    <header class="w-full max-w-4xl text-center mb-8">
        <h1 class="text-3xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500 tracking-wider mb-3">SNAPTIK RENDER</h1>
        <p class="text-slate-300 text-sm md:text-base font-semibold">Tải Video TikTok Không Logo, Render Sạch Trực Tiếp</p>
    </header>

    <main class="w-full max-w-2xl">
        <div class="bg-[#18132b] border border-purple-900/50 rounded-2xl p-4 md:p-6 shadow-2xl mb-6">
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="tiktokUrl" placeholder="Dán link TikTok..." class="bg-[#0f0b1e] border border-purple-800/60 text-white px-5 py-4 rounded-xl flex-1 focus:outline-none focus:border-pink-500 text-sm">
                <button onclick="sendToGitHubQueue()" id="submitBtn" class="gradient-btn font-bold px-8 py-4 rounded-xl text-white transition shadow-lg text-sm shrink-0">Tải Xuống</button>
            </div>
            <p id="statusText" class="text-xs text-purple-300 mt-3 text-center hidden"></p>
        </div>

        <div id="resultBox" class="bg-[#18132b] border border-purple-900/50 rounded-2xl p-6 shadow-2xl hidden mb-6">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="w-28 h-28 bg-purple-950/60 border border-purple-700/50 rounded-xl flex items-center justify-center text-4xl shrink-0">🎬</div>
                <div class="flex-1 w-full space-y-3 text-center md:text-left">
                    <h3 id="videoTitle" class="text-sm font-semibold text-slate-200 line-clamp-2">...</h3>
                    <a id="downloadCleanBtn" href="#" target="_blank" class="block w-full text-center gradient-btn font-bold py-3 px-4 rounded-xl text-white shadow-lg transition">Tải MP4 (Video Sạch)</a>
                </div>
            </div>
        </div>

        <div>
            <h3 class="text-xs font-bold uppercase text-purple-400 tracking-wider mb-4 text-center md:text-left">📜 Lịch Sử Video Đã Render</h3>
            <div id="historyGrid" class="space-y-3">
                <p class="text-slate-500 text-xs text-center py-4">Đang tải lịch sử...</p>
            </div>
        </div>
    </main>

    <script>
        // Đường dẫn file result.json trực tiếp trên GitHub Pages hoặc kho chứa của anh
        const RESULT_JSON_URL = "./result.json"; 
        let currentTargetUrl = "";
        let checkInterval = null;

        document.addEventListener("DOMContentLoaded", () => {
            loadResults();
            setInterval(loadResults, 5000);
        });

        async function sendToGitHubQueue() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const statusText = document.getElementById('statusText');
            const submitBtn = document.getElementById('submitBtn');

            if (!urlInput) { alert("Vui lòng dán link TikTok!"); return; }

            currentTargetUrl = urlInput;
            submitBtn.disabled = true;
            submitBtn.innerText = "Đang gửi...";
            statusText.classList.remove('hidden');
            statusText.innerText = "⏳ Đang đẩy link vào hàng đợi hệ thống...";
            statusText.className = "text-xs text-amber-400 mt-3 text-center";

            try {
                // Lưu ý: Để web tự ghi vào queue.json trên GitHub trực tiếp từ frontend, 
                // anh có thể dùng GitHub Actions hoặc đẩy qua dịch vụ trung gian nhẹ nhàng. 
                // Hoặc đơn giản nhất là dùng chính Colab đọc trực tiếp file queue.json.
                // Ở đây cách tối ưu nhất là dùng GitHub API (nếu web chạy ở chế độ có token) 
                // hoặc giữ lại 1 endpoint Web App siêu nhỏ chỉ để nhận POST queue.
                
                statusText.innerText = "🔄 Colab đang render video sạch (khoảng 15s)... Vui lòng đợi!";
                statusText.className = "text-xs text-purple-300 mt-3 text-center animate-pulse";

                if (checkInterval) clearInterval(checkInterval);
                checkInterval = setInterval(loadResults, 3000);
            } catch (err) {
                statusText.innerText = "❌ Lỗi kết nối!";
                submitBtn.disabled = false;
                submitBtn.innerText = "Tải Xuống";
            }
        }

        async function loadResults() {
            try {
                const res = await fetch(RESULT_JSON_URL + "?t=" + new Date().getTime());
                const items = await res.json();
                
                const historyGrid = document.getElementById('historyGrid');
                const resultBox = document.getElementById('resultBox');
                const videoTitle = document.getElementById('videoTitle');
                const downloadCleanBtn = document.getElementById('downloadCleanBtn');
                const submitBtn = document.getElementById('submitBtn');
                const statusText = document.getElementById('statusText');

                if (!items || items.length === 0) {
                    historyGrid.innerHTML = '<p class="text-slate-500 text-xs text-center py-4">Chưa có dữ liệu.</p>';
                    return;
                }

                if (currentTargetUrl) {
                    const match = items.find(item => item.url === currentTargetUrl);
                    if (match) {
                        clearInterval(checkInterval);
                        currentTargetUrl = "";
                        statusText.classList.add('hidden');
                        submitBtn.disabled = false;
                        submitBtn.innerText = "Tải Xuống";

                        videoTitle.innerText = match.title || "Video TikTok Sạch";
                        downloadCleanBtn.href = match.downloadUrl;
                        resultBox.classList.remove('hidden');
                    }
                }

                historyGrid.innerHTML = '';
                items.slice(0, 5).forEach(item => {
                    historyGrid.innerHTML += `
                        <div class="bg-[#18132b] border border-purple-900/40 rounded-xl p-3 flex justify-between items-center gap-3">
                            <div class="min-w-0 flex-1">
                                <h4 class="text-xs font-semibold text-purple-200 truncate">${item.title}</h4>
                                <p class="text-[10px] text-slate-400">🕒 ${item.date}</p>
                            </div>
                            <a href="${item.downloadUrl}" target="_blank" class="gradient-btn px-4 py-2 rounded-lg text-xs font-bold text-white shrink-0">📥 Tải MP4</a>
                        </div>
                    `;
                });
            } catch (e) {
                // Đang chờ dữ liệu
            }
        }
    </script>
</body>
</html>
