<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Video TikTok Affiliate Của Tôi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold mb-2">📥 Kho Lưu Trữ & Quản Lý Video TikTok</h1>
            <p class="text-slate-400">Hệ thống quản lý video và link Affiliate tự động</p>
        </header>

        <!-- Danh sách video đã lưu trong kho -->
        <h2 class="text-xl font-bold mb-4">📦 Danh Sách Video Đã Lưu Kho</h2>
        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-slate-400 col-span-2 text-center">Đang tải dữ liệu kho...</p>
        </div>
    </div>

    <script>
        let videoList = [];

        async function loadStoredVideos() {
            try {
                // Thêm tham số thời gian để tránh bị lưu cache cũ của trình duyệt
                let response = await fetch('products_data.json?t=' + new Date().getTime());
                videoList = await response.json();
                displayVideos(videoList);
            } catch (error) {
                document.getElementById('videoGrid').innerHTML = '<p class="text-slate-400 col-span-2 text-center">Kho video hiện đang trống.</p>';
            }
        }

        function displayVideos(videos) {
            const grid = document.getElementById('videoGrid');
            grid.innerHTML = '';
            
            if (!videos || videos.length === 0) {
                grid.innerHTML = '<p class="text-slate-400 col-span-2 text-center">Chưa có video nào trong kho.</p>';
                return;
            }

            videos.forEach((item, index) => {
                const card = `
                    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between hover:border-indigo-500 transition">
                        <div>
                            <span class="text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded">Video #${index + 1}</span>
                            <h3 class="font-medium text-sm mt-2 text-indigo-200">${item.title}</h3>
                            <a href="${item.video_url}" target="_blank" class="text-xs text-blue-400 hover:underline block mt-1 truncate">Link TikTok: ${item.video_url}</a>
                        </div>
                        <div class="flex gap-2 mt-4">
                            <a href="${item.video_url}" target="_blank" class="flex-1 bg-slate-700 hover:bg-slate-600 text-center py-1.5 rounded text-xs transition">Xem Video</a>
                            <a href="${item.aff_link}" target="_blank" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-center py-1.5 rounded text-xs transition">Link Affiliate</a>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        loadStoredVideos();
    </script>
</body>
</html>
