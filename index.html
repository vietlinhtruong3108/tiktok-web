<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tự Động Hóa Re-up TikTok</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold mb-2">🚀 Hệ Thống Tự Động Hóa Re-up TikTok</h1>
            <p class="text-slate-400 text-sm">Gửi link từ Web 👉 Colab tự động chạy 👉 Nhận kết quả trực tiếp</p>
        </header>

        <!-- Khung nhập link -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 md:p-6 shadow-xl mb-8">
            <h2 class="text-sm font-semibold mb-3 text-indigo-300">📥 Dán Link TikTok Cần Xử Lý:</h2>
            <div class="flex flex-col md:flex-row gap-3">
                <input type="text" id="tiktokUrl" placeholder="Dán link TikTok (vd: https://vt.tiktok.com/...)" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-lg flex-1 focus:outline-none focus:border-indigo-500 text-sm">
                <button onclick="sendToDrive()" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-3 rounded-lg font-medium text-sm transition text-center text-white">Gửi Vào Hàng Đợi</button>
            </div>
            <p id="statusText" class="text-xs text-slate-400 mt-3 text-center"></p>
        </div>

        <!-- Kho Video Sạch Đã Hoàn Thành -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">📦 Kho Video Sạch Đã Xong</h2>
            <button onclick="loadLocalStorage()" class="text-xs text-emerald-400 hover:underline">🔄 Làm mới danh sách</button>
        </div>
        
        <div id="storageGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Video sạch sẽ hiển thị ở đây -->
        </div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycby8SovUIyD_-j2Gs1QgHKesgslph3RbDiKOmUPCzRCsCoIu1sVKJexQfMQuJNpddLk3UA/exec"; // Thay URL Google Apps Script của anh vào đây

        document.addEventListener("DOMContentLoaded", () => {
            loadLocalStorage();
        });

        async function sendToDrive() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const statusText = document.getElementById('statusText');
            const submitBtn = document.getElementById('submitBtn');

            if (!urlInput) {
                statusText.innerText = "Vui lòng dán link TikTok hợp lệ!";
                statusText.className = "text-xs text-rose-400 mt-3 text-center";
                return;
            }

            submitBtn.innerText = "Đang gửi...";
            submitBtn.disabled = true;
            statusText.innerText = "⏳ Đang truyền link vào hệ thống...";
            statusText.className = "text-xs text-amber-400 mt-3 text-center";

            try {
                // 1. Bắn request ngầm lên Google Apps Script để lưu vào queue.json trên Drive cho Colab đọc
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: urlInput })
                });

                // 2. Lưu tạm trạng thái "Đang xử lý" lên giao diện web ngay lập tức để anh dễ theo dõi
                let storage = JSON.parse(localStorage.getItem('tiktok_clean_storage') || '[]');
                storage.unshift({
                    title: "⏳ Đang render video mới từ link...",
                    date: "Vừa xong",
                    isPending: true
                });
                localStorage.setItem('tiktok_clean_storage', JSON.stringify(storage));
                
                loadLocalStorage();

                statusText.innerText = "✅ Gửi link thành công! Colab đang xử lý ngầm, vui lòng đợi 30-45 giây.";
                statusText.className = "text-xs text-emerald-400 mt-3 text-center";
                document.getElementById('tiktokUrl').value = '';
            } catch (error) {
                statusText.innerText = "❌ Lỗi kết nối: " + error;
                statusText.className = "text-xs text-rose-400 mt-3 text-center";
            } finally {
                submitBtn.innerText = "Gửi Vào Hàng Đợi";
                submitBtn.disabled = false;
            }
        }

        // Tải danh sách video đã làm sạch lưu trực tiếp trên trình duyệt hoặc đồng bộ
        function loadLocalStorage() {
            const storageGrid = document.getElementById('storageGrid');
            let storage = JSON.parse(localStorage.getItem('tiktok_clean_storage') || '[]');
            
            storageGrid.innerHTML = '';
            if (storage.length === 0) {
                storageGrid.innerHTML = '<p class="text-slate-400 col-span-2 text-center py-6">Kho video đang trống. Hãy dán link từ trên web để hệ thống tự động chạy.</p>';
                return;
            }

            storage.forEach((item) => {
                if(item.isPending) {
                    storageGrid.innerHTML += `
                        <div class="bg-slate-800 border border-amber-500/30 rounded-xl p-4 flex flex-col justify-between">
                            <h4 class="text-xs font-medium text-amber-300 truncate mb-1">⚡ ${item.title}</h4>
                            <p class="text-[11px] text-slate-400 mb-3">🕒 ${item.date}</p>
                            <span class="bg-amber-500/20 text-amber-300 text-center py-1.5 rounded text-[11px] font-semibold">Đang xử lý trên Colab...</span>
                        </div>
                    `;
                } else {
                    storageGrid.innerHTML += `
                        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex flex-col justify-between">
                            <div>
                                <h4 class="text-xs font-medium text-emerald-300 truncate mb-1">🎬 ${item.title}</h4>
                                <p class="text-[11px] text-slate-400 mb-3">🕒 Thời gian: ${item.date}</p>
                            </div>
                            <div>
                                <a href="https://drive.google.com/drive/folders/1_Q..." target="_blank" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-2 rounded text-xs font-semibold transition text-white block text-center">📂 Mở Thư Mục Drive Để Tải</a>
                            </div>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
